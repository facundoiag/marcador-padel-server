<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marcador de Pádel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1: #0a1128;
    --bg-2: #060a1a;
    --blue: #2f8fff;
    --blue-dim: #1c5fb3;
    --white: #f4f7ff;
    --alert: #ff5a4e;
    --muted: #6b7a99;
    --panel: rgba(255,255,255,0.04);
    --panel-border: rgba(47,143,255,0.25);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background: radial-gradient(circle at 50% -10%, var(--bg-2), #020409 70%);
    color: var(--white);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    height:100vh;
    display:flex;
    flex-direction:column;
  }

  header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding: 16px 3vw 10px;
  }
  .marca{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .marca .punto-marca{
    width:10px; height:10px; border-radius:50%;
    background: var(--blue);
    box-shadow: 0 0 12px var(--blue);
  }
  .eyebrow{
    font-size: 13px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--white);
    font-weight:600;
  }
  .header-derecha{ display:flex; gap:10px; }
  .modo-pill{
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: rgba(47,143,255,0.12);
    color: var(--blue);
    border: 1px solid var(--panel-border);
    border-radius: 999px;
    padding: 5px 14px;
  }

  main{
    flex: 1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding: 0 4vw;
  }

  .scoreboard{
    width:100%;
    max-width: 1400px;
    background: linear-gradient(180deg, rgba(47,143,255,0.06), transparent 40%), var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 20px;
    padding: 3vh 3vw;
  }

  .fila-equipos{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }

  .equipo{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 1.2vh;
  }

  .nombre{
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: clamp(18px, 2.2vw, 30px);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--white);
    text-align:center;
  }

  .punto{
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: clamp(80px, 13vw, 180px);
    line-height: 1;
    color: var(--white);
    font-variant-numeric: tabular-nums;
  }

  .divisor-central{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 6px;
    padding: 0 2vw;
  }
  .divisor-central .linea{
    width: 2px;
    height: 10vh;
    background: linear-gradient(180deg, transparent, var(--blue), transparent);
  }
  .divisor-central .etiqueta-pts{
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .deuce-banner{
    font-family:'Oswald', sans-serif;
    font-size: clamp(13px, 1.5vw, 18px);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--alert);
    min-height: 20px;
    font-weight: 600;
  }

  .tracker{
    display:flex;
    justify-content:center;
    gap: 10px;
    margin-top: 3vh;
    padding-top: 2.5vh;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .tracker-equipo{
    display:flex;
    align-items:center;
    gap: 14px;
  }
  .caja{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 2px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 8px 16px;
    min-width: 64px;
  }
  .caja .valor{
    font-family:'Oswald', sans-serif;
    font-size: clamp(20px, 2.4vw, 30px);
    font-weight: 600;
    color: var(--white);
  }
  .caja.sets .valor{ color: var(--blue); }
  .caja .etiqueta{
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .separador-tracker{
    width:1px; height: 40px;
    background: rgba(255,255,255,0.08);
  }

  footer{
    display:flex;
    justify-content: space-between;
    align-items:center;
    padding: 2vh 3vw;
    gap: 20px;
    background: linear-gradient(180deg, transparent, rgba(47,143,255,0.06));
  }
  .estado-conexion{
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.05em;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .punto-estado{
    width:8px; height:8px; border-radius:50%;
    background: var(--alert);
  }
  .punto-estado.ok{ background: var(--blue); box-shadow: 0 0 8px var(--blue); }

  .marca-club{
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .qr-box{
    display:flex;
    align-items:center;
    gap: 12px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 8px 14px;
  }
  .qr-box img{
    width: 64px; height: 64px;
    border-radius: 6px;
    background: #fff;
    padding: 4px;
  }
  .qr-box .texto{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .qr-box .texto .titulo{
    font-size: 12px;
    font-weight:600;
    color: var(--white);
  }
  .qr-box .texto .sub{
    font-size: 11px;
    color: var(--muted);
  }

  @media (max-width: 700px){
    header{ flex-direction:column; gap:10px; align-items:flex-start; }
    .header-derecha{ flex-wrap:wrap; }
    .fila-equipos{ flex-wrap:wrap; gap: 16px; }
    .divisor-central{ display:none; }
    .equipo{ flex: 1 1 45%; }
    footer{ flex-direction:column; align-items:flex-start; gap:12px; }
  }

  .overlay-cambio{
    position: fixed;
    inset: 0;
    background: rgba(2,4,9,0.94);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
    z-index: 999;
  }
  .overlay-cambio.visible{
    opacity: 1;
  }
  .overlay-cambio .icono{
    font-size: clamp(40px, 6vw, 64px);
  }
  .overlay-cambio .titulo{
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: clamp(36px, 6vw, 72px);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--white);
    text-align:center;
  }
  .overlay-cambio .subtitulo{
    font-size: clamp(14px, 1.6vw, 20px);
    color: var(--blue);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<header>
  <div class="marca">
    <span class="punto-marca"></span>
    <span class="eyebrow" id="eyebrowClub">Patio Padel</span>
    <span class="eyebrow" id="eyebrowCancha" style="color:var(--blue);"></span>
  </div>
  <div class="header-derecha">
    <span class="modo-pill" id="modoPill">Punto de oro</span>
    <span class="modo-pill" id="botonAudio" style="cursor:pointer;">🔊 Audio</span>
  </div>
</header>

<main>
  <div class="scoreboard">
    <div class="fila-equipos">
      <div class="equipo" id="panelA">
        <div class="nombre" id="nombreA">Equipo A</div>
        <div class="punto" id="puntoA">0</div>
        <div class="deuce-banner" id="deuceA"></div>
      </div>

      <div class="divisor-central">
        <div class="linea"></div>
        <span class="etiqueta-pts">PTS</span>
        <div class="linea"></div>
      </div>

      <div class="equipo" id="panelB">
        <div class="nombre" id="nombreB">Equipo B</div>
        <div class="punto" id="puntoB">0</div>
        <div class="deuce-banner" id="deuceB"></div>
      </div>
    </div>

    <div class="tracker">
      <div class="tracker-equipo">
        <div class="caja"><div class="valor" id="gamesA">0</div><div class="etiqueta">Games</div></div>
        <div class="caja sets"><div class="valor" id="setsA">0</div><div class="etiqueta">Sets</div></div>
      </div>
      <div class="separador-tracker"></div>
      <div class="tracker-equipo">
        <div class="caja sets"><div class="valor" id="setsB">0</div><div class="etiqueta">Sets</div></div>
        <div class="caja"><div class="valor" id="gamesB">0</div><div class="etiqueta">Games</div></div>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="estado-conexion">
    <span class="punto-estado" id="puntoEstado"></span>
    <span id="textoEstado">Conectando al marcador…</span>
  </div>
  <div class="marca-club">Malvín Norte · Montevideo</div>
  <div class="qr-box">
    <img id="qrConfig" alt="QR configuración">
    <div class="texto">
      <div class="titulo">Escaneá para configurar</div>
      <div class="sub">Nombres y modo de juego</div>
    </div>
  </div>
</footer>

<div class="overlay-cambio" id="overlayCambioLado">
  <div class="icono">🔄</div>
  <div class="titulo">Cambio de campo</div>
  <div class="subtitulo">Patio Padel</div>
</div>

<script>
// ---------- Config por defecto ----------
let config = {
  nombreA: "Equipo A",
  nombreB: "Equipo B",
  goldenPoint: true,   // true = punto de oro, false = ventaja/deuce
  bestOf: 3,           // 1 o 3 sets
  tiebreak: true,       // true = tie-break a X games, false = set con ventaja
  gamesPerSet: 6,       // 6 (estándar) o 5 (set corto)
  cambioLado: "impares", // "impares" | "finSet" | "nunca"
  conteoModo: "puntos", // "puntos" (15-30-40) | "juegos" (cada toque suma un juego directo)
  desempate: "set",     // "set" (3er set normal) | "superTiebreak" (rompe a 10 en vez de 3er set)
  modoArbitro: false    // true = pensado para que un árbitro controle desde config.html
};

let estado = {
  puntosA: 0, puntosB: 0,
  gamesA: 0, gamesB: 0,
  setsA: 0, setsB: 0,
  enTiebreak: false,
  esSuperTiebreak: false,
  objetivoTiebreak: 7,
  tbA: 0, tbB: 0
};

// ---------- Cronómetro para guardar duración de cada set y del partido ----------
let tiempoInicioPartido = null;
let tiempoInicioSet = null;
let numeroSetActual = 1;

function enviarPersistencia(mensaje){
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(mensaje));
}

const ETIQUETAS_PUNTO = ["0", "15", "30", "40"];

function etiquetaPunto(puntos, oponente, esGolden){
  if (estado.enTiebreak) return String(puntos);
  if (puntos >= 3 && oponente >= 3) {
    if (esGolden) return "40";
    if (puntos === oponente) return "40";
    return puntos > oponente ? "AD" : "40";
  }
  return ETIQUETAS_PUNTO[Math.min(puntos, 3)];
}

function textoDeuce(propio, oponente){
  if (estado.enTiebreak) return "";
  if (propio >= 3 && oponente >= 3) {
    if (config.goldenPoint) return propio === oponente ? "Punto de oro" : "";
    if (propio === oponente) return "Deuce";
    return propio > oponente ? "Ventaja" : "";
  }
  return "";
}

// ---------- Voz (anuncia el marcador) ----------
let audioActivado = true;

function hablar(texto){
  if (!audioActivado || !("speechSynthesis" in window)) return;
  try {
    window.speechSynthesis.cancel(); // corta el anuncio anterior si se pisan
    const u = new SpeechSynthesisUtterance(texto);
    u.lang = "es-ES";
    u.rate = 1;
    window.speechSynthesis.speak(u);
  } catch(e) {
    console.warn("No se pudo anunciar por voz:", e);
  }
}

function anunciarPunto(){
  const dA = textoDeuce(estado.puntosA, estado.puntosB);
  const dB = textoDeuce(estado.puntosB, estado.puntosA);
  if (dA === "Ventaja") { hablar("Ventaja, " + config.nombreA); return; }
  if (dB === "Ventaja") { hablar("Ventaja, " + config.nombreB); return; }
  if (dA) { hablar(dA); return; } // Deuce o Punto de oro (es igual para ambos)
  const eA = etiquetaPunto(estado.puntosA, estado.puntosB, config.goldenPoint);
  const eB = etiquetaPunto(estado.puntosB, estado.puntosA, config.goldenPoint);
  hablar(eA + " a " + eB);
}

function anunciarPuntoTiebreak(){
  hablar(estado.tbA + " a " + estado.tbB);
}

function anunciarJuego(ganador){
  const nombre = ganador === "A" ? config.nombreA : config.nombreB;
  hablar("Juego, " + nombre + ". " + estado.gamesA + " a " + estado.gamesB);
}

function anunciarSet(ganador){
  const nombre = ganador === "A" ? config.nombreA : config.nombreB;
  hablar("Set para " + nombre + ". " + estado.setsA + " a " + estado.setsB + " en sets.");
}

function anunciarPartido(ganador){
  const nombre = ganador === "A" ? config.nombreA : config.nombreB;
  hablar("Partido para " + nombre + "!");
}

// ---------- Aviso de cambio de campo ----------
let timeoutCambioLado = null;
function mostrarCambioDeLado(){
  const overlay = document.getElementById("overlayCambioLado");
  overlay.classList.add("visible");
  hablar("Cambio de campo");
  clearTimeout(timeoutCambioLado);
  timeoutCambioLado = setTimeout(() => {
    overlay.classList.remove("visible");
  }, 4500);
}

function evaluarCambioDeLado(sumaGamesAntesDeReset, terminoSet){
  if (config.cambioLado === "nunca") return;
  if (config.cambioLado === "impares" && sumaGamesAntesDeReset % 2 === 1) {
    mostrarCambioDeLado();
    return;
  }
  if (config.cambioLado === "finSet" && terminoSet) {
    mostrarCambioDeLado();
  }
}

// ---------- Suma / resta de puntos ----------
function sumarPunto(equipo){
  if (config.conteoModo === "juegos" && !estado.enTiebreak) {
    // Modo "solo juegos": cada toque gana un juego entero directamente
    ganarJuego(equipo);
    render();
    return;
  }
  if (estado.enTiebreak) {
    if (equipo === "A") estado.tbA++; else estado.tbB++;
    const termino = revisarFinTiebreak();
    if (!termino) anunciarPuntoTiebreak();
  } else {
    if (equipo === "A") estado.puntosA++; else estado.puntosB++;
    const termino = revisarFinGame();
    if (!termino) anunciarPunto();
  }
  render();
}

function restarPunto(equipo){
  if (config.conteoModo === "juegos" && !estado.enTiebreak) {
    if (equipo === "A" && estado.gamesA > 0) estado.gamesA--;
    if (equipo === "B" && estado.gamesB > 0) estado.gamesB--;
    hablar(estado.gamesA + " a " + estado.gamesB);
    render();
    return;
  }
  if (estado.enTiebreak) {
    if (equipo === "A" && estado.tbA > 0) estado.tbA--;
    if (equipo === "B" && estado.tbB > 0) estado.tbB--;
    anunciarPuntoTiebreak();
  } else {
    if (equipo === "A" && estado.puntosA > 0) estado.puntosA--;
    if (equipo === "B" && estado.puntosB > 0) estado.puntosB--;
    anunciarPunto();
  }
  render();
}

// ---------- Ganar un juego (llamado desde puntos normales o desde modo "solo juegos") ----------
function ganarJuego(ganador){
  estado.puntosA = 0; estado.puntosB = 0;
  if (ganador === "A") estado.gamesA++; else estado.gamesB++;
  const sumaGames = estado.gamesA + estado.gamesB;
  const terminoSet = revisarFinSet();
  evaluarCambioDeLado(sumaGames, terminoSet);
  if (!terminoSet) anunciarJuego(ganador);
}

function revisarFinGame(){
  const a = estado.puntosA, b = estado.puntosB;
  let ganador = null;

  if (config.goldenPoint && a >= 3 && b >= 3) {
    // muerte súbita: el que llega a 40-40 y suma, gana
    if (a > b) ganador = "A";
    else if (b > a) ganador = "B";
  } else {
    if (a >= 4 && a - b >= 2) ganador = "A";
    if (b >= 4 && b - a >= 2) ganador = "B";
  }

  if (ganador) {
    ganarJuego(ganador);
    return true;
  }
  return false;
}

// ---------- Iniciar un tie-break (normal, en el set) o super tie-break (decide el partido) ----------
function iniciarTiebreak(esSuper){
  estado.enTiebreak = true;
  estado.esSuperTiebreak = esSuper;
  estado.objetivoTiebreak = esSuper ? 10 : 7;
  estado.tbA = 0; estado.tbB = 0;
  hablar(esSuper ? "Super tie-break, a 10 puntos" : "Tie-break");
}

function revisarFinSet(){
  const ga = estado.gamesA, gb = estado.gamesB;
  const objetivo = config.gamesPerSet;

  if (config.tiebreak && ga === objetivo && gb === objetivo && !estado.enTiebreak) {
    iniciarTiebreak(false);
    return false;
  }

  let ganadorSet = null;
  if (ga >= objetivo && ga - gb >= 2) ganadorSet = "A";
  if (gb >= objetivo && gb - ga >= 2) ganadorSet = "B";

  if (ganadorSet) {
    // Guardamos el resultado del set ANTES de resetear los games a 0
    const duracionSeg = tiempoInicioSet ? Math.round((Date.now() - tiempoInicioSet) / 1000) : null;
    enviarPersistencia({
      tipo: "set_completado",
      numeroSet: numeroSetActual,
      gamesA: ga, gamesB: gb, tbA: null, tbB: null,
      ganador: ganadorSet, duracionSeg
    });
    numeroSetActual++;
    tiempoInicioSet = Date.now();

    if (ganadorSet === "A") estado.setsA++; else estado.setsB++;
    estado.gamesA = 0; estado.gamesB = 0;
    const terminoPartido = revisarFinPartido();
    if (!terminoPartido) anunciarSet(ganadorSet);
    else anunciarPartido(ganadorSet);

    if (terminoPartido) {
      const duracionTotalSeg = tiempoInicioPartido ? Math.round((Date.now() - tiempoInicioPartido) / 1000) : null;
      enviarPersistencia({
        tipo: "partido_completado",
        ganador: ganadorSet, setsA: estado.setsA, setsB: estado.setsB, duracionTotalSeg
      });
    }

    // ¿Corresponde jugar un super tie-break en vez de un 3er set?
    if (!terminoPartido && config.bestOf === 3 && config.desempate === "superTiebreak" &&
        estado.setsA === 1 && estado.setsB === 1) {
      iniciarTiebreak(true);
    }
    return true;
  }
  return false;
}

function revisarFinTiebreak(){
  const a = estado.tbA, b = estado.tbB;
  const objetivo = estado.objetivoTiebreak;
  let ganador = null;
  if (a >= objetivo && a - b >= 2) ganador = "A";
  if (b >= objetivo && b - a >= 2) ganador = "B";
  if (ganador) {
    const esSuper = estado.esSuperTiebreak;
    let sumaGames = 0;
    let gamesAGuardar = estado.gamesA, gamesBGuardar = estado.gamesB;
    if (!esSuper) {
      if (ganador === "A") { estado.gamesA = objetivo; estado.setsA++; }
      else { estado.gamesB = objetivo; estado.setsB++; }
      gamesAGuardar = estado.gamesA; gamesBGuardar = estado.gamesB;
      sumaGames = estado.gamesA + estado.gamesB; // siempre impar
    } else {
      // el super tie-break decide directamente el set/partido, sin jugar games
      if (ganador === "A") estado.setsA++; else estado.setsB++;
      gamesAGuardar = 0; gamesBGuardar = 0;
    }

    const duracionSeg = tiempoInicioSet ? Math.round((Date.now() - tiempoInicioSet) / 1000) : null;
    enviarPersistencia({
      tipo: "set_completado",
      numeroSet: numeroSetActual,
      gamesA: gamesAGuardar, gamesB: gamesBGuardar, tbA: a, tbB: b,
      ganador, duracionSeg
    });
    numeroSetActual++;
    tiempoInicioSet = Date.now();

    estado.gamesA = 0; estado.gamesB = 0;
    estado.enTiebreak = false;
    estado.esSuperTiebreak = false;
    estado.objetivoTiebreak = 7;
    estado.tbA = 0; estado.tbB = 0;
    if (!esSuper) evaluarCambioDeLado(sumaGames, true);
    const terminoPartido = revisarFinPartido();
    if (!terminoPartido) anunciarSet(ganador);
    else anunciarPartido(ganador);

    if (terminoPartido) {
      const duracionTotalSeg = tiempoInicioPartido ? Math.round((Date.now() - tiempoInicioPartido) / 1000) : null;
      enviarPersistencia({
        tipo: "partido_completado",
        ganador, setsA: estado.setsA, setsB: estado.setsB, duracionTotalSeg
      });
    }
    return true;
  }
  return false;
}

function revisarFinPartido(){
  const setsParaGanar = Math.ceil(config.bestOf / 2);
  return estado.setsA >= setsParaGanar || estado.setsB >= setsParaGanar;
}

function render(){
  document.getElementById("nombreA").textContent = config.nombreA;
  document.getElementById("nombreB").textContent = config.nombreB;

  let etiquetaModo = (config.goldenPoint ? "Punto de oro" : "Ventaja") + " · Al mejor de " + config.bestOf +
    " · Sets a " + config.gamesPerSet;
  if (config.bestOf === 3 && config.desempate === "superTiebreak") etiquetaModo += " · Super tie-break";
  if (config.conteoModo === "juegos") etiquetaModo += " · Solo juegos";
  if (estado.enTiebreak) etiquetaModo = estado.esSuperTiebreak ? "SUPER TIE-BREAK (a 10)" : "TIE-BREAK";
  document.getElementById("modoPill").textContent = etiquetaModo;

  if (config.conteoModo === "juegos") {
    document.getElementById("puntoA").textContent = estado.gamesA;
    document.getElementById("puntoB").textContent = estado.gamesB;
  } else {
    document.getElementById("puntoA").textContent = etiquetaPunto(estado.puntosA, estado.puntosB, config.goldenPoint) === "AD" && !estado.enTiebreak
      ? "AD" : (estado.enTiebreak ? estado.tbA : etiquetaPunto(estado.puntosA, estado.puntosB, config.goldenPoint));
    document.getElementById("puntoB").textContent = estado.enTiebreak ? estado.tbB : etiquetaPunto(estado.puntosB, estado.puntosA, config.goldenPoint);
  }

  document.getElementById("gamesA").textContent = estado.gamesA;
  document.getElementById("gamesB").textContent = estado.gamesB;
  document.getElementById("setsA").textContent = estado.setsA;
  document.getElementById("setsB").textContent = estado.setsB;

  document.getElementById("deuceA").textContent = config.conteoModo === "juegos" ? "" : textoDeuce(estado.puntosA, estado.puntosB);
  document.getElementById("deuceB").textContent = config.conteoModo === "juegos" ? "" : textoDeuce(estado.puntosB, estado.puntosA);
}

// ---------- Configuración del servidor en la nube ----------
// Cambiar por el dominio real una vez desplegado el servidor.
const SERVIDOR_HTTP = "https://marcador-padel-server.onrender.com";
const SERVIDOR_WS = "wss://marcador-padel-server.onrender.com";

// La cancha se identifica por parámetro en la URL: ?cancha=cancha1
const CANCHA = new URLSearchParams(window.location.search).get("cancha") || "cancha1";

// ---------- QR de configuración ----------
function actualizarQR(){
  try {
    const urlConfig = SERVIDOR_HTTP + "/config?cancha=" + encodeURIComponent(CANCHA);
    const qrImgSrc = "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" + encodeURIComponent(urlConfig);
    document.getElementById("qrConfig").src = qrImgSrc;
  } catch(e) {
    console.warn("No se pudo generar el QR:", e);
  }
}

// ---------- WebSocket (hacia el servidor en la nube, no al ESP32) ----------
let ws;
function conectarWS(){
  try {
    ws = new WebSocket(SERVIDOR_WS + "/ws?cancha=" + encodeURIComponent(CANCHA));

    ws.onopen = () => {
      document.getElementById("puntoEstado").classList.add("ok");
      document.getElementById("textoEstado").textContent = "Marcador conectado";
    };
    ws.onclose = () => {
      document.getElementById("puntoEstado").classList.remove("ok");
      document.getElementById("textoEstado").textContent = "Reconectando…";
      setTimeout(conectarWS, 1500);
    };
    ws.onerror = () => {
      // Se maneja en onclose; esto solo evita que el error quede sin atrapar
    };
  ws.onmessage = (msg) => {
    try {
      const data = JSON.parse(msg.data);
      if (data.tipo === "config") {
        config.nombreA = data.nombreA || config.nombreA;
        config.nombreB = data.nombreB || config.nombreB;
        config.goldenPoint = data.goldenPoint;
        config.bestOf = data.bestOf;
        config.tiebreak = data.tiebreak;
        config.cambioLado = data.cambioLado || "impares";
        config.gamesPerSet = data.gamesPerSet || 6;
        config.conteoModo = data.conteoModo || "puntos";
        config.desempate = data.desempate || "set";
        config.modoArbitro = !!data.modoArbitro;
        // reinicia el partido al cambiar configuración
        estado = {puntosA:0,puntosB:0,gamesA:0,gamesB:0,setsA:0,setsB:0,enTiebreak:false,esSuperTiebreak:false,objetivoTiebreak:7,tbA:0,tbB:0};
        tiempoInicioPartido = Date.now();
        tiempoInicioSet = Date.now();
        numeroSetActual = 1;
        render();
      } else if (data.equipo && data.accion) {
        if (data.accion === "suma") sumarPunto(data.equipo);
        if (data.accion === "resta") restarPunto(data.equipo);
      }
    } catch(e) { console.error("Mensaje inválido", e); }
    };
  } catch(e) {
    document.getElementById("textoEstado").textContent = "Sin conexión al marcador";
    console.warn("No se pudo conectar el WebSocket:", e);
  }
}

// ---------- Toggle de audio ----------
document.getElementById("botonAudio").addEventListener("click", () => {
  audioActivado = !audioActivado;
  document.getElementById("botonAudio").textContent = audioActivado ? "🔊 Audio" : "🔇 Audio";
  if (!audioActivado) window.speechSynthesis.cancel();
});

// ---------- Nombre de la cancha (viene directo de la URL, no del ESP32) ----------
document.getElementById("eyebrowCancha").textContent = "· " + CANCHA;

actualizarQR();
render();
conectarWS();
</script>
